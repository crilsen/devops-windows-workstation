name: ci

on:
  push:
  pull_request:

jobs:
  powershell-lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./bootstrap.ps1, ./scripts, ./configs -Recurse -Severity Warning, Error
          $results | Format-Table -AutoSize | Out-String | Write-Host
          if ($results.Where({ $_.Severity -eq 'Error' })) { exit 1 }

      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path ./bootstrap.ps1, ./scripts, ./configs, ./tests -Filter *.ps1 -Recurse
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          }

      - name: Validate Oh My Posh theme JSON
        shell: pwsh
        run: Get-Content ./configs/oh-my-posh.json -Raw | ConvertFrom-Json | Out-Null

      - name: Run Pester tests
        shell: pwsh
        run: |
          Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.0
          Invoke-Pester -Path ./tests -Output Detailed
